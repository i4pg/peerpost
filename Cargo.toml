[package]
name = "peerpost"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A local message relay for Codex CLI and Claude Code sessions"
license = "MIT OR Apache-2.0"
authors = ["the peerpost contributors"]
readme = "README.md"

[dependencies]
rmcp = { version = "3.10.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
anyhow = "1"
rand = "0.9"
libc = "0.2"

[dev-dependencies]
futures = "0.3"
tempfile = "3"
